[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-linux"
version = "0.4.0"
description = "Native Linux Locus with mixed routing, automatic driving speed and mapped traffic stops"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["PySide6==6.10.2", "pymobiledevice3==11.12.4", "requests>=2.32,<3", "packaging>=24", "defusedxml>=0.7.1"]

[project.scripts]
locus-linux = "locus_linux.app:main"

[tool.setuptools.package-data]
locus_linux = ["web/*", "web/images/*"]
