name: Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: linux
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install Linux app
        run: python -m pip install .
      - name: Verify dependencies
        run: python -m pip check
      - name: Run tests without a phone or desktop session
        run: python -m unittest discover -s tests -v
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/locus-wheels" .
