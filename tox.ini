[tox]
env_list = lint, unit
skipsdist = true

[testenv]
skip_install = true
set_env =
    PYTHONDONTWRITEBYTECODE = 1

[testenv:lint]
deps = ruff==0.17.3
commands = ruff check --no-cache linux

[testenv:unit]
description = Install Linux package and run unit tests with offscreen Qt
changedir = {toxinidir}/linux
deps = -e{toxinidir}/linux
set_env =
    {[testenv]set_env}
    QT_QPA_PLATFORM = offscreen
commands =
    python -m pip check
    python -m unittest discover -s tests -v
